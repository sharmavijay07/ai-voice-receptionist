faqs:
  - id: mobile
    triggers: [mobile, come to me, at my house, at my office, on site]
    answer: We work out of the shop on Springdale so the finish stays clean. No mobile service right now.
  - id: cancellation
    triggers: [cancellation policy, cancel policy, how late can i cancel]
    answer: You can move or cancel up to 24 hours ahead at no charge. Inside 24 hours there's a $50 shop fee.
  - id: payment
    triggers: [payment, do you take cards, credit card, deposit]
    answer: We take cards. Ceramic and front PPF are half down to hold the day. Everything else is paid at pickup.
  - id: wait
    triggers: [loaner, wait, waiting, ride, drop off, drop-off]
    answer: Express washes are fine to wait for. Bigger jobs are drop-off. There's no loaner car. The waiting area has coffee.
  - id: ceramic-warranty
    triggers: [warranty, ceramic warranty, how long does ceramic last]
    answer: The coating we install carries a 2-year finish warranty when the car is hand washed. We go over care at pickup.
  - id: tint-law
    triggers: [legal, tint law, how dark, vlt]
    answer: In Texas the front side windows have to stay at 25% VLT or lighter. We won't install a shade that would fail inspection.
  - id: size
    triggers: [truck, suv, vehicle size, how is price]
    answer: The range on each service is the vehicle size. A compact sits at the low end, a truck or large SUV at the high end.
  - id: reschedule
    triggers: [reschedule, move my appointment, change my appointment]
    answer: I can move it. Tell me the new day and I'll check the book.
policies:
  cancellation: You can move or cancel up to 24 hours ahead at no charge. Inside 24 hours there's a $50 shop fee.
  payment: Ceramic and front PPF are half down to hold the day, the rest at pickup. Everything else is paid when you pick up. We take cards.
  dropoff: Pull around to the second bay. If we're already in a job, drop the keys in the lockbox and we'll text you.
