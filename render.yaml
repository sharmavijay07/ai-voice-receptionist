# Render free web service. Only GROQ_API_KEY is required; type it in the dashboard.
# Calendar, CRM, SMS, email, Vapi, Retell, and Twilio stay in demo/mock mode until their keys exist.
services:
  - type: web
    name: ai-voice-receptionist
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --no-audit --no-fund && NODE_OPTIONS=--max-old-space-size=460 npm run build
    startCommand: NODE_OPTIONS=--max-old-space-size=384 npm run start
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODE
        value: tools
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: CALENDAR_PROVIDER
        value: mock
      - key: CRM_PROVIDER
        value: local
      - key: SMS_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: mock
      - key: DEMO_SEED
        value: "true"
      - key: BUSINESS_CONFIG
        value: business/northline.yaml
      - key: STORE_PATH
        value: data/store.json
