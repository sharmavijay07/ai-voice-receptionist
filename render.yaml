# Render free web service.
# Secrets stay sync: false so Don pastes them in the dashboard. See README "Go live with free tools".
# Calendar, Sheets, Gmail, and Postgres turn on when their secrets are present.
services:
  - type: web
    name: ai-voice-receptionist
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --no-audit --no-fund && NODE_OPTIONS=--max-old-space-size=460 npm run build
    startCommand: NODE_OPTIONS=--max-old-space-size=384 npm run start
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODE
        value: tools
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: CALENDAR_PROVIDER
        value: mock
      - key: CRM_PROVIDER
        value: local
      - key: SMS_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: mock
      - key: DEMO_SEED
        value: "true"
      - key: BUSINESS_CONFIG
        value: business/northline.yaml
      - key: STORE_PATH
        value: data/store.json
      - key: VAPI_MODEL_PROVIDER
        value: vapi
      - key: PUBLIC_BASE_URL
        sync: false
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_ASSISTANT_ID
        sync: false
      - key: VAPI_MODEL
        sync: false
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      - key: TRANSFER_NUMBER
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: SHOP_OWNER_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_SHEETS_ID
        sync: false
      - key: DATABASE_URL
        sync: false
